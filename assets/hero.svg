<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Stack of books with a growing sprout</title>
  <defs>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7A4F"/><stop offset="1" stop-color="#1F5C3A"/>
    </linearGradient>
    <linearGradient id="g-brown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A97A52"/><stop offset="1" stop-color="#7C5234"/>
    </linearGradient>
    <linearGradient id="g-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/><stop offset="1" stop-color="#EFE3CB"/>
    </linearGradient>
    <linearGradient id="g-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BD67E"/><stop offset="1" stop-color="#4FA35A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6BBF59" stop-opacity=".35"/><stop offset="1" stop-color="#6BBF59" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1F5C3A" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- ambient glow behind the sprout -->
  <circle cx="420" cy="150" r="170" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="320" cy="470" rx="250" ry="18" fill="#1F5C3A" opacity=".12"/>

  <g filter="url(#soft)">
    <!-- bottom book (wide, brown) -->
    <rect x="120" y="390" width="360" height="62" rx="10" fill="url(#g-brown)"/>
    <rect x="120" y="390" width="360" height="10" rx="5" fill="#fff" opacity=".12"/>
    <rect x="132" y="418" width="336" height="4" fill="#fff" opacity=".18"/>

    <!-- middle book (green) -->
    <rect x="150" y="326" width="300" height="60" rx="10" fill="url(#g-green)"/>
    <rect x="150" y="326" width="300" height="10" rx="5" fill="#fff" opacity=".14"/>
    <rect x="162" y="352" width="276" height="4" fill="#fff" opacity=".2"/>

    <!-- top book (cream with lines) -->
    <rect x="176" y="266" width="252" height="56" rx="10" fill="url(#g-cream)" stroke="#D9C8A6" stroke-width="2"/>
    <rect x="196" y="290" width="150" height="4" rx="2" fill="#B9A27B"/>
    <rect x="196" y="302" width="110" height="4" rx="2" fill="#B9A27B" opacity=".7"/>
  </g>

  <!-- stem -->
  <path d="M326 266 C326 220, 322 190, 330 150" fill="none" stroke="#2E7A4F" stroke-width="5" stroke-linecap="round"/>

  <!-- leaves -->
  <path d="M328 210 C300 200, 282 176, 290 150 C316 156, 332 180, 328 210 Z" fill="url(#g-leaf)"/>
  <path d="M330 178 C356 166, 378 140, 372 112 C346 118, 330 146, 330 178 Z" fill="url(#g-leaf)"/>
  <path d="M331 150 C318 132, 320 108, 338 96 C350 116, 346 138, 331 150 Z" fill="url(#g-leaf)"/>

  <!-- small accent dots (sparkle of seeds) -->
  <circle cx="460" cy="120" r="5" fill="#6BBF59" opacity=".7"/>
  <circle cx="500" cy="170" r="3" fill="#8B5E3C" opacity=".5"/>
  <circle cx="180" cy="160" r="4" fill="#6BBF59" opacity=".5"/>
</svg>
